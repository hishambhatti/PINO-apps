data:
  name: 'BlackScholes-0000'
  total_num: 1000
  n_train: 900
  n_test: 100
  nx: 512
  nt: 100
  sub: 32
  sub_t: 4
  # Black-Scholes physical parameters
  r: 0.05
  sigma: 0.2
  T: 1.0
  S_min: 1.0
  S_max: 200.0
  K_min: 60.0
  K_max: 140.0

model:
  layers: [16, 24, 24, 32, 32]
  modes1: [15, 12, 9, 9]
  modes2: [15, 12, 9, 9]
  fc_dim: 128
  activation: gelu

train:
  batchsize: 20
  epochs: 500
  # milestones: [150, 250, 350, 450, 550, 650, 750, 850, 950]
  milestones: [150, 300, 450]
  base_lr: 0.001
  scheduler_gamma: 0.5
  ic_loss: 5.0
  f_loss: 1.0
  xy_loss: 10.0
  save_dir: 'BlackScholes'
  save_name: 'BlackScholes-eqn.pt'
  ckpt: 'checkpoints/BlackScholes/BlackScholes-eqn.pt'
  ckpt_freq: 100

log:
  project: 'PINO-BlackScholes'
  group: 'BlackScholes-0000'

test:
  batchsize: 1
  ckpt: 'checkpoints/BlackScholes/BlackScholes-eqn.pt'
